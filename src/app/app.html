<div class="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
  
  <!-- Header / Navbar Principal -->
  <app-header></app-header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6 sm:space-y-8">
    
    <!-- Banner Informativo / Boas-vindas -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-4 sm:p-5 text-white shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-white/15 rounded-xl backdrop-blur-xs">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight">Escala de Limpeza e Transparência</h1>
          <p class="text-xs text-blue-100">
            Registro em tempo real com data e hora exata.
          </p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 text-xs bg-white/10 px-3 py-1.5 rounded-xl border border-white/15 self-stretch sm:self-auto justify-center">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>Revezamento Semanal Ativo</span>
      </div>
    </div>

    <!-- 1. Painel do Responsável da Semana (CleanUp Dashboard) -->
    <section aria-labelledby="painel-responsavel-title">
      <app-dashboard-resumo></app-dashboard-resumo>
    </section>

    <!-- Barra de Troca Rápida de Perfil -->
    <section aria-label="Seletor de Morador Ativo">
      <app-seletor-perfil></app-seletor-perfil>
    </section>

    <!-- 2. Checklist de Tarefas da Semana -->
    <section aria-labelledby="checklist-title">
      <app-checklist-tarefas></app-checklist-tarefas>
    </section>

    <!-- 3. Visão da Escala de Rodízio (Ocupando a seção inteira abaixo do Checklist) -->
    <section aria-labelledby="escala-title">
      <app-escala-rodizio></app-escala-rodizio>
    </section>

    <!-- 3. Feed / Histórico de Atividades (Log de Transparência) -->
    <section aria-labelledby="feed-historico-title">
      <app-historico-atividades></app-historico-atividades>
    </section>

  </main>

  <!-- Rodapé Clean & Moderno -->
  <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
      <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
        <span class="font-bold text-slate-700">CleanUp</span>
        <span class="text-slate-300">&bull;</span>
        <span>Feito por <strong class="text-slate-700 font-semibold">Quezia Costa</strong></span>
        <a
          href="https://wa.me/5581999466900"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:bg-emerald-200 border border-emerald-200 text-[11px] font-semibold transition-colors shadow-2xs"
          title="Entrar em contato via WhatsApp / Celular: (81) 9 9946-6900"
        >
          <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
          <span>Contato</span>
        </a>
        <span class="hidden md:inline text-slate-300">&bull;</span>
        <span class="hidden md:inline">Sistema de Monitoramento e Escala Compartilhada</span>
      </div>
      <div class="text-[11px] sm:text-xs text-slate-400">
        <span>Angular Signals &bull; Tailwind CSS &bull; Auditoria HH:mm:ss</span>
      </div>
    </div>
  </footer>

  <!-- Modal de Gerenciamento de Membros -->
  <app-gerenciar-membros></app-gerenciar-membros>

</div>
