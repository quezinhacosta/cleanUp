<div class="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
  
  <!-- Header / Navbar Principal -->
  <app-header></app-header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6 sm:space-y-8">
    
    <!-- Banner Informativo / Boas-vindas -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-4 sm:p-5 text-white shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-white/15 rounded-xl backdrop-blur-xs">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight">Escala de Limpeza & Transparência do Apto</h1>
          <p class="text-xs text-blue-100">
            Registro em tempo real com data e hora exata para acabar com desfalques nas tarefas.
          </p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 text-xs bg-white/10 px-3 py-1.5 rounded-xl border border-white/15 self-stretch sm:self-auto justify-center">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>Revezamento Semanal Ativo</span>
      </div>
    </div>

    <!-- 1. Painel do Responsável da Semana (CleanUp Dashboard) -->
    <section aria-labelledby="painel-responsavel-title">
      <app-dashboard-resumo></app-dashboard-resumo>
    </section>

    <!-- Grid: Checklist (Esquerda / Principal) + Escala (Direita ou Abaixo) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- 2. Checklist de Tarefas da Semana -->
      <section class="lg:col-span-7 xl:col-span-8 space-y-6" aria-labelledby="checklist-title">
        <app-checklist-tarefas></app-checklist-tarefas>
      </section>

      <!-- 4. Visão da Escala de Rodízio (Lateral no Desktop) -->
      <section class="lg:col-span-5 xl:col-span-4" aria-labelledby="escala-title">
        <app-escala-rodizio></app-escala-rodizio>
      </section>

    </div>

    <!-- 3. Feed / Histórico de Atividades (Log de Transparência) -->
    <section aria-labelledby="feed-historico-title">
      <app-historico-atividades></app-historico-atividades>
    </section>

  </main>

  <!-- Rodapé Clean & Moderno -->
  <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-slate-700">CleanUp</span>
        <span>•</span>
        <span>Sistema de Monitoramento e Escala Compartilhada</span>
      </div>
      <div>
        <span>Atualização em tempo real &bull; Angular Signals &bull; Tailwind CSS</span>
      </div>
    </div>
  </footer>

  <!-- Modal de Gerenciamento de Membros -->
  <app-gerenciar-membros></app-gerenciar-membros>

</div>
